<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++ to WebAssembly playground</title>
<style>
    :root {
        color-scheme: light dark;
        --border: #8884;
        --accent: #2f6feb;
    }
    body {
        margin: 0;
        font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }
    header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
    }
    header h1 {
        font-size: 15px;
        margin: 0;
    }
    header .note {
        opacity: 0.7;
        font-size: 12px;
    }
    main {
        display: flex;
        flex: 1;
        min-height: 0;
    }
    section {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        padding: 10px;
        gap: 8px;
    }
    section + section {
        border-left: 1px solid var(--border);
    }
    textarea, pre {
        flex: 1;
        margin: 0;
        padding: 10px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        resize: none;
        overflow: auto;
        white-space: pre-wrap;
    }
    .bar {
        display: flex;
        gap: 8px;
        align-items: center;
    }
    button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
    }
    button.secondary {
        background: transparent;
        color: inherit;
    }
    button:disabled {
        opacity: 0.6;
        cursor: progress;
    }
    .status {
        font-size: 12px;
        opacity: 0.75;
    }
    .timing {
        font-size: 12px;
        opacity: 0.75;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .error {
        color: #c0392b;
    }
    code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
</style>
</head>
<body>
<header>
    <h1>C++ to WebAssembly playground</h1>
    <span class="note">a subset of C++17, compiled in your browser</span>
</header>
<main>
    <section>
        <div class="bar">
            <button id="run">Compile and run</button>
            <button id="example" class="secondary">Load an example</button>
            <span class="status" id="status">ready</span>
        </div>
        <textarea id="source" spellcheck="false" aria-label="C++ source"></textarea>
    </section>
    <section>
        <div class="bar">
            <span class="status">output</span>
            <span class="timing" id="timing"></span>
        </div>
        <pre id="output" aria-label="Program output"></pre>
    </section>
</main>
<script src="host.js"></script>
<script>
"use strict";

// The compiler runs in a worker, so a deep program never blocks the page.
const worker = new Worker("playground-worker.js");
const source = document.getElementById("source");
const output = document.getElementById("output");
const status = document.getElementById("status");
const timing = document.getElementById("timing");
const runButton = document.getElementById("run");
const exampleButton = document.getElementById("example");

// The compiler is the WebAssembly build of the compiler, which the site
// serves next to the page in the `pkg` directory.  The URL is relative to
// the page, so the page works at the root of a site and in a subdirectory
// of one, which is how GitHub Pages serves a project site.
const parameters = new URLSearchParams(location.search);
const compilerUrl = parameters.get("compiler") || "pkg/cppbolt_bg.wasm";

const EXAMPLES = [
    `#include <cstdio>

int main() {
    int total = 0;
    for (int i = 1; i <= 10; i = i + 1) {
        total = total + i;
    }
    std::printf("total=%d\\n", total);
    return 0;
}
`,
    `#include <cstdio>
#include <string>

struct Point {
    int x;
    int y;
    Point(int a, int b) : x(a), y(b) {
        std::printf("Point(%d, %d)\\n", x, y);
    }
};

int main() {
    Point p(3, 4);
    std::string text = "hello";
    std::printf("%s %d\\n", text.c_str(), p.x + p.y);
    return 0;
}
`,
];

let requestId = 0;
let exampleIndex = 0;
const pending = new Map();

worker.onmessage = (event) => {
    const entry = pending.get(event.data.id);
    if (!entry) {
        return;
    }
    pending.delete(event.data.id);
    entry(event.data);
};

function compileInWorker(text) {
    const id = ++requestId;
    return new Promise((resolve) => {
        pending.set(id, resolve);
        worker.postMessage({
            id,
            source: text,
            // The worker resolves the URL against the page, so the site works
            // at the root of a domain and in a subdirectory of one.
            url: new URL(compilerUrl, document.baseURI).href,
        });
    });
}

function show(text, isError) {
    output.textContent = text;
    output.className = isError ? "error" : "";
}

// Formats a duration in milliseconds.
function formatMs(value) {
    if (!isFinite(value)) {
        return "?";
    }
    if (value < 1) {
        return `${value.toFixed(2)} ms`;
    }
    if (value < 1000) {
        return `${value.toFixed(1)} ms`;
    }
    return `${(value / 1000).toFixed(2)} s`;
}

// Shows the time of every step of the last run.
function showTiming(steps) {
    const parts = Object.entries(steps)
        .filter(([, value]) => typeof value === "number" && isFinite(value))
        .map(([name, value]) => `${name} ${formatMs(value)}`);
    timing.textContent = parts.join(" · ");
}

// Thrown by the exit import of a program, so the program stops where it
// asked to stop, exactly like a native program does.
class ProgramExit {
    constructor(code) {
        this.code = code;
    }
}

async function runProgram(bytes) {
    let exitCode = null;
    const host = createWasmImports(null, "", (code) => {
        exitCode = code;
        throw new ProgramExit(code);
    });
    const started = performance.now();
    let trap = null;
    let returned = 0;
    try {
        const program = await WebAssembly.instantiate(bytes, host.imports);
        if (program.instance.exports.main) {
            returned = program.instance.exports.main();
        } else if (program.instance.exports._start) {
            returned = program.instance.exports._start();
        }
    } catch (error) {
        if (!(error instanceof ProgramExit)) {
            trap = error;
        }
    }
    const elapsed = performance.now() - started;
    const text = host.getStdout();
    if (trap) {
        show(`${text}\n[trap: ${trap.message}]`, true);
        status.textContent = "trap";
    } else {
        // The exit import stops the program, and the value that main returns
        // is the exit code of the program, exactly like a native program.
        const code = exitCode === null ? (returned || 0) : exitCode;
        show(code ? `${text}\n[exit ${code}]` : text, false);
        status.textContent = code ? `exit ${code}` : "done";
    }
    runButton.disabled = false;
    return elapsed;
}

runButton.addEventListener("click", async () => {
    runButton.disabled = true;
    status.textContent = "compiling...";
    show("", false);
    showTiming({});
    const started = performance.now();
    const result = await compileInWorker(source.value);
    if (!result.ok) {
        show(result.diagnostic, true);
        status.textContent = "diagnostic";
        showTiming({
            compile: result.compileMs || 0,
            load: result.loadMs,
            total: performance.now() - started,
        });
        runButton.disabled = false;
        return;
    }
    status.textContent = "running...";
    const runMs = await runProgram(result.bytes);
    showTiming({
        load: result.loadMs,
        compile: result.compileMs || 0,
        run: runMs,
        total: performance.now() - started,
    });
});

exampleButton.addEventListener("click", () => {
    source.value = EXAMPLES[exampleIndex % EXAMPLES.length];
    exampleIndex += 1;
    status.textContent = "example loaded";
});

source.value = EXAMPLES[0];

// A link can carry the program, so a failing case can be shared.
const code = parameters.get("code");
if (code !== null) {
    source.value = code;
}

if (parameters.get("run") === "1") {
    runButton.click();
}
</script>
</body>
</html>
