name: Deploy playground and documentation to GitHub Pages

# The site is a static bundle containing:
# 1. The in-browser C++ playground at `/`
# 2. The mdBook documentation at `/book/`
# 3. The rustdoc API documentation at `/api/`

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: pages-wasm

      - name: Install mdBook (pinned version)
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.40'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify feature matrix test paths
        run: python3 tools/check_feature_matrix.py

      - name: Run doctests
        run: cargo test --doc

      - name: Build the compiler for the browser
        run: cargo build --release --target wasm32-unknown-unknown --lib

      - name: Assemble the playground site
        run: tools/build_site.sh

      - name: Build mdBook documentation
        run: |
          mdbook build docs/book
          python3 tools/check_book_links.py
          cd docs/book
          mdbook build --dest-dir ../../site/book

      - name: Build rustdoc API documentation (strict warnings)
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --lib --bins
          cp -r target/doc site/api

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
