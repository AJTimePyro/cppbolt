[package]
name = "cppbolt"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/AJTimePyro/cppbolt"
homepage = "https://ajtimepyro.is-a.dev/cppbolt/"
documentation = "https://ajtimepyro.is-a.dev/cppbolt/book/"

[lib]
name = "cppbolt"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cppbolt-cli"
path = "src/main.rs"

[[bin]]
name = "cppbolt-testrunner"
path = "src/bin/cppbolt-testrunner.rs"

[dependencies]

# Panic-free code on every path that can see user input.
[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false
